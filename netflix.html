<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mini-Netflix — Demo</title>
  <style>
    * { box-sizing: border-box; margin:0; padding:0; }
    html,body { height:100%; background:#050505; color:#e6e6e6; font-family: Inter, Arial, sans-serif; }

    header {
      position:sticky; top:0; z-index:50;
      background: linear-gradient(180deg, rgba(5,5,5,0.95), rgba(5,5,5,0.6));
      padding:14px 28px; display:flex; align-items:center; gap:20px;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .logo { color:#e50914; font-weight:800; font-size:20px; }
    .nav { display:flex; gap:12px; align-items:center; }
    .nav a { color:#ddd; text-decoration:none; font-size:14px; padding:6px 8px; border-radius:4px; }
    .nav a:hover { background: rgba(255,255,255,0.03); }
    .spacer { flex:1; }
    .controls { display:flex; gap:10px; align-items:center; }

    .hero {
      padding:28px; display:flex; gap:22px; align-items:flex-end;
      background-image: linear-gradient(180deg, rgba(0,0,0,0.0), rgba(0,0,0,0.6));
    }
    .hero-poster { width:220px; height:130px; border-radius:6px; overflow:hidden; background:#222; flex-shrink:0; box-shadow: 0 10px 25px rgba(0,0,0,0.6); }
    .hero-info { color:#fff; }
    .hero-title { font-size:26px; font-weight:700; margin-bottom:6px; }
    .hero-desc { max-width:720px; color:#cfcfcf; font-size:14px; line-height:1.45; }

    .row { padding:18px 24px; }
    .row-title { font-weight:700; font-size:16px; margin:6px 0 12px 6px; color:#fff; }
    .carousel {
      display:flex; gap:12px; overflow-x:auto; padding-bottom:6px; scrollbar-width:thin;
    }
    .card {
      min-width:170px; width:170px; height:96px; border-radius:6px; background:#111; overflow:hidden;
      position:relative; flex:0 0 auto; cursor:pointer; transition: transform .18s ease, box-shadow .18s;
    }
    .card img { width:100%; height:100%; object-fit:cover; display:block; }
    .card:hover { transform: translateY(-8px) scale(1.02); box-shadow: 0 8px 30px rgba(0,0,0,0.7); }
    .card .badge {
      position:absolute; left:8px; bottom:8px; background:rgba(0,0,0,0.6); padding:4px 6px; font-size:12px; border-radius:4px;
    }

    footer { padding:30px 24px; color:#9b9b9b; font-size:13px; border-top:1px solid rgba(255,255,255,0.03); }

    .loading { padding:40px; text-align:center; color:#bdbdbd; }
    .error { padding:24px; color:#ffb4b4; background: rgba(255,0,0,0.03); border-radius:6px; }

    @media (max-width:720px) {
      .hero { flex-direction:column; align-items:flex-start; gap:12px; padding:16px; }
      .hero-poster { width:120px; height:72px; }
      .card { min-width:120px; width:120px; height:72px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">NETFLIX</div>
    <nav class="nav">
      <a href="#">Home</a>
      <a href="#">Series</a>
      <a href="#">Movies</a>
      <a href="#">Latest</a>
      <a href="#">My List</a>
    </nav>
    <div class="spacer"></div>
    <div class="controls">
      <input id="search" placeholder="Хайх..." style="background:#111;border:1px solid rgba(255,255,255,0.03); color:#ddd; padding:6px 10px; border-radius:6px;"/>
      <button id="refreshBtn" style="background:transparent;border:none;color:#ddd;cursor:pointer">⟲</button>
    </div>
  </header>
