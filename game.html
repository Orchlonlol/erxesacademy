<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Snake Game</title>
  <style>
    body {
      background-color: #f0f0f0;
      text-align: center;
      font-family: sans-serif;
    }
    canvas {
      background-color: #000;
      margin-top: 20px;
      border: 2px solid #333;
    }
    #restartBtn {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 16px;
      display: none;
    }
  </style>
</head>
<body>
  <h1>🐍 Snake Game</h1>
  <canvas id="game" width="400" height="400"></canvas>
  <br />
  <button id="restartBtn">🔄 Restart</button>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const box = 20;
    const canvasSize = 400;

    let snake;
    let direction;
    let food;
    let gameLoop;

    const restartBtn = document.getElementById("restartBtn");

    function startGame() {
      snake = [{ x: 9 * box, y: 9 * box }];
      direction = "RIGHT";
      food = {
        x: Math.floor(Math.random() * (canvasSize / box)) * box,
        y: Math.floor(Math.random() * (canvasSize / box)) * box
      };
      restartBtn.style.display = "none";
      clearInterval(gameLoop);
      gameLoop = setInterval(draw, 150); // ← 👈 УДААН болгосон хэсэг
    }

    document.addEventListener("keydown", changeDirection);

    function changeDirection(e) {
      if (e.key === "ArrowLeft" && direction !== "RIGHT") direction = "LEFT";
      else if (e.key === "ArrowUp" && direction !== "DOWN") direction = "UP";
      else if (e.key === "ArrowRight" && direction !== "LEFT") direction = "RIGHT";
      else if (e.key === "ArrowDown" && direction !== "UP") direction = "DOWN";
    }

    function draw() {
      ctx.clearRect(0, 0, canvasSize, canvasSize);

      // Draw snake
      for (let i = 0; i < snake.length; i++) {
        ctx.fillStyle = i === 0 ? "lime" : "white";
        ctx.fillRect(snake[i].x, snake[i].y, box, box);
      }

      // Draw food
      ctx.fillStyle = "red";
      ctx.fillRect(food.x, food.y, box, box);

      // Snake head movement
      let headX = snake[0].x;
      let headY = snake[0].y;

      if (direction === "LEFT") headX -= box;
      if (direction === "RIGHT") headX += box;
      if (direction === "UP") headY -= box;
      if (direction === "DOWN") headY += box;

      // Game over: wall hit or self collision
      if (
        headX < 0 || headX >= canvasSize ||
        headY < 0 || headY >= canvasSize ||
        snake.some(seg => seg.x === headX && seg.y === headY)
      ) {
        clearInterval(gameLoop);
        restartBtn.style.display = "inline-block";
        return;
      }

      // Eat food
      let newHead;
      if (headX === food.x && headY === food.y) {
        newHead = { x: headX, y: headY };
        food = {
          x: Math.floor(Math.random() * (canvasSize / box)) * box,
          y: Math.floor(Math.random() * (canvasSize / box)) * box
        };
      } else {
        newHead = { x: headX, y: headY };
        snake.pop(); // Remove tail
      }

      snake.unshift(newHead);
    }

    restartBtn.onclick = startGame;

    startGame(); // Auto start
  </script>
</body>
</html>
